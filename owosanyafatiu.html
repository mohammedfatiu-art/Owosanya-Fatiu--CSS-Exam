<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam</title>
  </head>
  <body>
    <style>
      .h1{
        color: blue;
        font-size: 32px;
        letter-spacing: 2px;
      }

      .boxb{
        font-size: 14px;
      }

      .box{
        text-align: center;
        width: 200px;
        height: 100px;
        padding: 2px 2px 2px 2px;
        background-color: rgb( 245 245 245);
        border-radius: 12px;
        box-shadow: 2px 2px 1px blue;
        position: relative;
      }

      .pass{
        width: 40px;
        height: 20px;
        border-radius: 50%;
        background-color: blue;
        position: absolute;
        top: 2px;
        right: 2px;
      }
    </style>
    <h1 class="h1">
      Student Result Card
    </h1>
    <table border="2">
        <tr>
            <th>Subject</th>
            <th>Score</th>
            <th>Grade</th>
        </tr>
        <tr style>
            <td>Math</td>
            <td>70</td>
            <td>B</td>
        </tr>
        <tr>
            <td>English</td>
            <td>90</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Biology</td>
            <td>75</td>
            <td>B</td>
        </tr>
        <tr>
            <td>Physics</td>
            <td>100</td>
            <td>A</td>
        </tr>
        <tr>
            <td>Chemistry</td>
            <td>60</td>
            <td>C</td>
        </tr> 
    </table>
    <br><br>
    <div class="box">
        <h1 class="boxb">Student Info</h1>
        Name: Patrick Daniel
        <br>
        Class: Jss2
        <br>
        Average Score: 60
        <div class="pass">
            Pass

        </div>
    </div>
    <br>

    <button type="button">Print Result</button>
    
</body>
</html>
